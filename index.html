<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NamA GPS Camera Pro</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .camera-viewport { position: relative; flex-grow: 1; width: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video, canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; }

        .watermark-layer {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 5;
        }
        .wm-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }
        .wm-table-preview {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            border-collapse: collapse;
        }
        .wm-table-preview th, .wm-table-preview td {
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 4px 8px;
            text-align: center;
        }

        .vertical-watermark-preview {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.35);
            font-weight: bold;
            letter-spacing: 2px;
            pointer-events: none;
            white-space: nowrap;
            z-index: 5;
        }

        .control-panel { background: #141414; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #2a2a2a; z-index: 10; }
        
        .note-field-group {
            display: flex;
            align-items: center;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 2px 8px;
            gap: 8px;
        }
        .note-field-group input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px 0;
            font-size: 0.82rem;
            outline: none;
        }
        .edit-icon { font-size: 1rem; cursor: pointer; opacity: 0.8; }

        .toolbar-row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
        .btn-action-small { background: #2a2a2a; border: 1px solid #444; color: #ccc; padding: 7px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        #settingsModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 99;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #1e1e1e;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-content h3 { font-size: 0.95rem; color: #035835; margin-bottom: 5px; }
        .modal-content label { font-size: 0.75rem; color: #aaa; display: flex; flex-direction: column; gap: 4px; }
        .modal-content input { background: #2a2a2a; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 6px; font-size: 0.85rem; }
        .btn-close-modal { background: #035835; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        .settings-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: #aaa; padding: 0 4px; align-items: center; }
        .settings-row label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
        .btn-capture { width: 60px; height: 60px; border-radius: 50%; background: #fff; border: 4px solid #035835; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .btn-capture:active { transform: scale(0.92); }

        .mode-tabs { display: flex; background: #0a0a0a; border-radius: 16px; padding: 2px; }
        .tab-btn { background: none; border: none; color: #888; padding: 5px 12px; font-size: 0.75rem; font-weight: bold; border-radius: 14px; cursor: pointer; }
        .tab-btn.active { background: #035835; color: #fff; }
    </style>
</head>
<body>

    <div class="camera-viewport" id="viewport">
        <video id="camVideo" autoplay playsinline muted></video>
        <canvas id="camCanvas" style="display:none;"></canvas>

        <div id="uiVerticalText" class="vertical-watermark-preview">NAM A VALUATION</div>

        <div class="watermark-layer">
            <div class="wm-left">
                <div id="uiNoteDisplay">Máy nâng hạ</div>
                <div id="uiTimeDisplay" style="font-size: 0.75rem; font-weight: normal; color: #ddd;">2026-11-09 12:00</div>
            </div>
            <div>
                <table class="wm-table-preview">
                    <tr>
                        <th></th>
                        <th>Decimal</th>
                        <th>DMS</th>
                    </tr>
                    <tr>
                        <td><b>Latitude</b></td>
                        <td id="uiLatDec">21.695105</td>
                        <td id="uiLatDMS">21°41'42" N</td>
                    </tr>
                    <tr>
                        <td><b>Longitude</b></td>
                        <td id="uiLngDec">104.846247</td>
                        <td id="uiLngDMS">104°50'46" E</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="note-field-group">
            <input type="text" id="txtNote" value="Máy nâng hạ" placeholder="Nhập ghi chú hiện trường..." oninput="updateUI()">
            <span class="edit-icon" onclick="document.getElementById('txtNote').focus()">✏️</span>
        </div>

        <div class="toolbar-row">
            <button class="btn-action-small" onclick="openSettings()">⚙️ Cài đặt chung & Bản quyền</button>
            <button class="btn-action-small" onclick="document.getElementById('fileLogo').click()">📁 Chọn Logo</button>
            <input type="file" id="fileLogo" accept="image/*" style="display:none;" onchange="loadLogo(event)">
        </div>

        <div class="settings-row">
            <label><input type="checkbox" id="chkVertical" checked onchange="updateUI()"> Hiện chữ dọc</label>
            <label><input type="checkbox" id="chkCoords" checked onchange="updateUI()"> Tọa độ</label>
            <span id="gpsStatus" style="color: #4cd964;">GPS: Sẵn sàng</span>
        </div>

        <div class="action-bar">
            <div class="mode-tabs">
                <button class="tab-btn active" onclick="switchMode('photo', event)">Chụp Ảnh</button>
                <button class="tab-btn" onclick="switchMode('video', event)">Quay Phim</button>
            </div>
            <button class="btn-capture" id="actionBtn" onclick="takePhoto()"></button>
            <div style="font-size: 0.7rem; color: #888;" id="timerDisplay">00:00</div>
        </div>
    </div>

    <div id="settingsModal">
        <div class="modal-content">
            <h3>Cài đặt Tên Khách Hàng & Bản Quyền</h3>
            <label>
                Tên khách hàng / Chủ tài sản:
                <input type="text" id="txtClient" placeholder="Nhập tên khách hàng..." oninput="updateUI()">
            </label>
            <label>
                Chữ bản quyền dọc trên ảnh:
                <input type="text" id="txtVerticalCopyright" value="NAM A VALUATION APP" placeholder="Nội dung chữ dọc..." oninput="updateUI()">
            </label>
            <button class="btn-close-modal" onclick="closeSettings()">Lưu & Đóng</button>
        </div>
    </div>

    <script>
        let mediaStream = null;
        let gpsData = { latDec: "21.695105", latDMS: "21°41'42\" N", lngDec: "104.846247", lngDMS: "104°50'46\" E" };
        let logoImage = null;
        let currentMode = 'photo';

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        async function initCamera() {
            try {
                if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
                
                // Cấu hình linh động tương thích mọi điện thoại
                const constraints = {
                    video: { facingMode: "environment" },
                    audio: currentMode === 'video'
                };
                
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                const videoElement = document.getElementById('camVideo');
                videoElement.srcObject = mediaStream;
                await videoElement.play();
            } catch (err) {
                console.log("Lỗi mở camera: " + err.message);
                // Fallback nếu lỗi camera sau
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    document.getElementById('camVideo').srcObject = mediaStream;
                } catch(e) {
                    alert("Không thể mở camera. Vui lòng kiểm tra quyền truy cập trình duyệt!");
                }
            }
        }

        function toDMS(coordinate, isLat) {
            const absolute = Math.abs(coordinate);
            const degrees = Math.floor(absolute);
            const minutesNotTruncated = (absolute - degrees) * 60;
            const minutes = Math.floor(minutesNotTruncated);
            const seconds = ((minutesNotTruncated - minutes) * 60).toFixed(0);
            let direction = "";
            if (isLat) {
                direction = coordinate >= 0 ? "N" : "S";
            } else {
                direction = coordinate >= 0 ? "E" : "W";
            }
            return `${degrees}°${minutes}'${seconds}" ${direction}`;
        }

        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    gpsData.latDec = lat.toFixed(6);
                    gpsData.latDMS = toDMS(lat, true);
                    gpsData.lngDec = lng.toFixed(6);
                    gpsData.lngDMS = toDMS(lng, false);

                    document.getElementById('uiLatDec').innerText = gpsData.latDec;
                    document.getElementById('uiLatDMS').innerText = gpsData.latDMS;
                    document.getElementById('uiLngDec').innerText = gpsData.lngDec;
                    document.getElementById('uiLngDMS').innerText = gpsData.lngDMS;
                    document.getElementById('gpsStatus').innerText = "GPS: OK";
                }, err => {
                    document.getElementById('gpsStatus').innerText = "GPS: Lỗi";
                }, { enableHighAccuracy: true });
            }
        }

        setInterval(() => {
            const now = new Date();
            const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} (Th ${now.getDay()===0?7:now.getDay()}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('uiTimeDisplay').innerText = timeString;
        }, 1000);

        function updateUI() {
            const note = document.getElementById('txtNote').value;
            document.getElementById('uiNoteDisplay').innerText = note;
        }

        function loadLogo(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = evt => {
                    logoImage = new Image();
                    logoImage.src = evt.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function switchMode(mode, evt) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(evt && evt.target) evt.target.classList.add('active');
            initCamera();
        }

        function takePhoto() {
            const video = document.getElementById('camVideo');
            const canvas = document.getElementById('camCanvas');
            canvas.width = video.videoWidth || 1920;
            canvas.height = video.videoHeight || 1080;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const scale = canvas.width / 1000;

            if(document.getElementById('chkVertical').checked) {
                const vText = document.getElementById('txtVerticalCopyright').value;
                ctx.save();
                ctx.translate(canvas.width - (25 * scale), canvas.height / 2);
                ctx.rotate(Math.PI / 2);
                ctx.font = `bold ${Math.round(22 * scale)}px sans-serif`;
                ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                ctx.textAlign = "center";
                ctx.fillText(vText, 0, 0);
                ctx.restore();
            }

            const pad = Math.round(30 * scale);

            ctx.save();
            ctx.font = `bold ${Math.round(36 * scale)}px sans-serif`;
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
            ctx.shadowBlur = 10;
            
            const noteVal = document.getElementById('txtNote').value;
            const now = new Date();
            const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            let currentY = canvas.height - pad - Math.round(50 * scale);
            ctx.fillText(noteVal, pad, currentY);

            ctx.font = `${Math.round(24 * scale)}px sans-serif`;
            ctx.fillStyle = "#dddddd";
            ctx.fillText(timeStr, pad, currentY + Math.round(35 * scale));
            ctx.restore();

            if(document.getElementById('chkCoords').checked) {
                const tableW = Math.round(420 * scale);
                const tableH = Math.round(140 * scale);
                const tableX = canvas.width - pad - tableW;
                const tableY = canvas.height - pad - tableH;

                ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
                ctx.fillRect(tableX, tableY, tableW, tableH);

                ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(tableX, tableY, tableW, tableH);

                const colW1 = Math.round(130 * scale);
                const colW2 = Math.round(145 * scale);
                const rowH = tableH / 3;

                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                ctx.beginPath(); ctx.moveTo(tableX + colW1, tableY); ctx.lineTo(tableX + colW1, tableY + tableH); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(tableX + colW1 + colW2, tableY); ctx.lineTo(tableX + colW1 + colW2, tableY + tableH); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(tableX, tableY + rowH); ctx.lineTo(tableX + tableW, tableY + rowH); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(tableX, tableY + rowH * 2); ctx.lineTo(tableX + tableW, tableY + rowH * 2); ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.font = `bold ${Math.round(20 * scale)}px sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                ctx.fillText("Decimal", tableX + colW1 + colW2/2, tableY + rowH/2);
                ctx.fillText("DMS", tableX + colW1 + colW2 + (tableW - colW1 - colW2)/2, tableY + rowH/2);

                ctx.textAlign = "left";
                ctx.fillText("Latitude", tableX + Math.round(10 * scale), tableY + rowH + rowH/2);
                ctx.textAlign = "center";
                ctx.font = `${Math.round(18 * scale)}px sans-serif`;
                ctx.fillText(gpsData.latDec, tableX + colW1 + colW2/2, tableY + rowH + rowH/2);
                ctx.fillText(gpsData.latDMS, tableX + colW1 + colW2 + (tableW - colW1 - colW2)/2, tableY + rowH + rowH/2);

                ctx.textAlign = "left";
                ctx.font = `bold ${Math.round(20 * scale)}px sans-serif`;
                ctx.fillText("Longitude", tableX + Math.round(10 * scale), tableY + rowH*2 + rowH/2);
                ctx.textAlign = "center";
                ctx.font = `${Math.round(18 * scale)}px sans-serif`;
                ctx.fillText(gpsData.lngDec, tableX + colW1 + colW2/2, tableY + rowH*2 + rowH/2);
                ctx.fillText(gpsData.lngDMS, tableX + colW1 + colW2 + (tableW - colW1 - colW2)/2, tableY + rowH*2 + rowH/2);
            }

            saveFile(canvas.toDataURL('image/jpeg', 0.95), `NAM_A_GPS_${Date.now()}.jpg`);
        }

        function saveFile(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        initCamera();
        initGPS();
        updateUI();
    </script>
</body>
</html>
