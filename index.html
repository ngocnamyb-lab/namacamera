<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>NamA GPS Camera Pro</title>
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"NamA GPS Camera Pro","short_name":"NamACamera","start_url":".","display":"standalone","background_color":"%23000000","theme_color":"%23000000","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3680/3680039.png","sizes":"512x512","type":"image/png"}]}'>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        html, body { width: 100vw; height: 100vh; background: #000; color: #fff; display: flex; flex-direction: row; overflow: hidden; position: fixed; }

        /* Khung chứa camera nằm chính giữa màn hình */
        .camera-viewport { position: relative; flex-grow: 1; height: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; background: #000; }
        canvas { display: none; }

        /* Container bọc toàn bộ watermark bám khít tuyệt đối bên trong khung hình */
        .video-inner-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 3;
        }

        /* Chữ bản quyền dọc nằm gọn gàng bên trong mép phải, cách mép phải đúng 2 ly (~8px) */
        .vertical-watermark-preview {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            transform-origin: right center;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* Bảng watermark phía dưới góc trái khung hình camera */
        .watermark-layer {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 12px;
            border-radius: 6px;
        }
        .wm-header-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .wm-badge { background: #ffcc00; color: #000; font-weight: bold; padding: 2px 6px; font-size: 0.75rem; border-radius: 3px; display: inline-flex; align-items: center; }
        .wm-logo-img { max-height: 20px; max-width: 70px; object-fit: contain; display: none; }
        .wm-title-text { font-size: 0.9rem; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        
        .wm-details { font-size: 0.7rem; color: #ddd; display: flex; flex-direction: column; gap: 1px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        /* Toàn bộ cụm điều khiển nằm gọn gàng ở CẠNH BÊN PHẢI */
        .control-panel { 
            width: 300px; 
            background: #141414; 
            padding: 14px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 1px solid #2a2a2a; 
            z-index: 10; 
            flex-shrink: 0; 
            height: 100vh;
        }

        .panel-top-group { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        
        .top-header-mini { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 0.75rem; }
        .top-header-mini button { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 0.7rem; }

        .note-field-group {
            display: flex;
            align-items: center;
            background: #222;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px 10px;
            gap: 6px;
            width: 100%;
        }
        .note-field-group input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.8rem;
            outline: none;
        }
        .edit-icon { font-size: 0.9rem; cursor: pointer; padding: 2px; }

        .action-bar-right { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 16px; 
            margin: auto 0;
        }

        .thumbnail-preview { width: 48px; height: 48px; border-radius: 8px; border: 2px solid #555; object-fit: cover; cursor: pointer; background: #222; display: none; }
        
        .btn-capture { width: 68px; height: 68px; border-radius: 50%; background: #fff; border: 4px solid #035835; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn-capture:active { transform: scale(0.92); }

        .mode-tabs { display: flex; background: #0a0a0a; border-radius: 12px; padding: 2px; width: 100%; justify-content: center; }
        .tab-btn { background: none; border: none; color: #888; padding: 6px 12px; font-size: 0.75rem; font-weight: bold; border-radius: 10px; cursor: pointer; flex: 1; text-align: center; }
        .tab-btn.active { background: #035835; color: #fff; }

        /* Modal Chỉnh sửa mẫu */
        #templateModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 99;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e1e1e;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .modal-header h3 { font-size: 1rem; color: #fff; }
        .modal-close { background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; }

        .toggle-item { display: flex; justify-content: space-between; align-items: center; background: #252525; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; }
        .toggle-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: #035835; cursor: pointer; }
        .toggle-item input[type="text"] { background: #333; border: 1px solid #555; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; outline: none; width: 140px; }
        .toggle-item input[type="color"] { background: none; border: none; width: 35px; height: 25px; cursor: pointer; }
        .toggle-item input[type="range"] { accent-color: #035835; cursor: pointer; width: 120px; }
        .btn-upload-modal { background: #035835; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }

        .btn-done { background: #035835; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; font-size: 0.9rem; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Khung camera nằm chính giữa màn hình -->
    <div class="camera-viewport" id="viewport">
        <video id="camVideo" autoplay playsinline muted></video>
        <canvas id="camCanvas"></canvas>

        <div class="video-inner-container">
            <div id="uiVerticalText" class="vertical-watermark-preview">NAM A VALUATION APP</div>

            <div class="watermark-layer" id="watermarkLayer">
                <div class="wm-header-row">
                    <span id="uiBadge" class="wm-badge">Điểm danh</span>
                    <img id="uiLogo" class="wm-logo-img" alt="Logo">
                    <span id="uiTitle" class="wm-title-text">Máy nâng hạ</span>
                </div>
                <div class="wm-details">
                    <div id="uiTime">Thứ Hai, 09/11/2026 18:45</div>
                    <div id="uiLocation">QL37, Âu Lâu, Lào Cai</div>
                    <div id="uiNote">Khảo sát hiện trạng thiết bị</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cụm điều khiển nằm gọn hoàn toàn ở bên phải -->
    <div class="control-panel">
        <div class="panel-top-group">
            <div class="top-header-mini">
                <span id="gpsStatus" style="color: #4cd964;">📍 Sẵn sàng</span>
                <button onclick="openTemplateModal()">⚙️ Cài đặt mẫu</button>
            </div>

            <div class="note-field-group">
                <input type="text" id="txtNoteQuick" value="Khảo sát hiện trạng thiết bị" placeholder="Nhập ghi chú..." oninput="syncNoteInput(this)">
                <span class="edit-icon" onclick="focusNoteInput()" title="Sửa ghi chú">✏️</span>
            </div>
        </div>

        <div class="action-bar-right">
            <img id="thumbPreview" class="thumbnail-preview" onclick="openLastPhoto()" alt="Ảnh chụp">
            
            <div class="mode-tabs">
                <button class="tab-btn active
